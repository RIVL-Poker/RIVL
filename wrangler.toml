name = "rivl"
main = "worker/rooms.js"
compatibility_date = "2026-09-01"

# The same Worker serves the website (dist/) and the multiplayer API, so the page
# talks to its own origin and no server URL needs to be configured.
[build]
command = "node scripts/build-site.mjs"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/ws/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# Accounts, online ratings, the public lobby and the daily free-plan budget.
[[durable_objects.bindings]]
name = "DIRECTORY"
class_name = "Directory"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Directory"]

# Per-visitor limits on creating and joining rooms.
[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "JOIN_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[[ratelimits]]
name = "ACCOUNT_LIMITER"
namespace_id = "1003"
simple = { limit = 5, period = 60 }

[vars]
# Extra site origins allowed to call the API, comma separated (e.g. a custom domain served elsewhere).
ALLOWED_ORIGINS = ""
# Daily budget that keeps online play inside Cloudflare's free plan (resets at midnight UTC).
# Measured cost is roughly 33 storage writes and 50 seconds of room time per hand, so 1,500 hands
# (about 20 table-hours) stays under the free limits of 100,000 writes and 13,000 GB-s per day.
DAILY_HAND_LIMIT = "1500"
DAILY_ROOM_LIMIT = "300"
DAILY_ACCOUNT_LIMIT = "500"
