name = "rivl"
main = "worker/rooms.js"
compatibility_date = "2026-09-01"

# The same Worker serves the website (dist/) and the multiplayer API, so the page
# talks to its own origin and no server URL needs to be configured.
[build]
command = "node scripts/build-site.mjs"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*", "/ws/*"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

# Per-visitor limits on creating and joining rooms.
[[ratelimits]]
name = "CREATE_LIMITER"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "JOIN_LIMITER"
namespace_id = "1002"
simple = { limit = 20, period = 60 }

[vars]
# Extra site origins allowed to call the API, comma separated (e.g. a custom domain served elsewhere).
ALLOWED_ORIGINS = ""
