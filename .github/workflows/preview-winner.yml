name: Preview winner popup on Cloudflare Pages

on:
  push:
    branches:
      - test/winner-showdown-presentation-20261015

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node tests.js
      - run: node tests-worker.mjs
      - run: node scripts/build-site.mjs
      - name: Publish isolated Pages preview (never production)
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.150.0"
          command: pages deploy dist --project-name=rivl-6cu --branch=winner-showdown-preview
