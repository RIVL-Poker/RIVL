name: Deploy RIVL Rooms Worker

on:
  push:
    branches:
      - feature/private-rooms-foundation
    paths:
      - "worker/**"
      - "wrangler.toml"
      - ".github/workflows/deploy-rooms.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rivl-rooms-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Deployment is disabled until an owner explicitly enables it.
    if: ${{ vars.RIVL_ROOMS_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - name: Verify Cloudflare configuration
        env:
          CF_ACCOUNT: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test -n "$CF_ACCOUNT" || { echo "Missing CLOUDFLARE_ACCOUNT_ID repository variable"; exit 1; }
          test -n "$CF_TOKEN" || { echo "Missing CLOUDFLARE_API_TOKEN repository secret"; exit 1; }
      - name: Deploy separate RIVL Rooms Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
